name: Java Facture Test

on:
  push:
    branches: [ facture ]
  pull_request:
    branches: [ facture ]

jobs:
  build-test-facture:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: devops_java
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping --silent" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 18
      uses: actions/setup-java@v3
      with:
        java-version: '18'
        distribution: 'temurin'

    - name: Wait for MySQL to be ready
      run: |
        for i in {1..30}; do
          if mysql -h 127.0.0.1 -P 3306 -u root -proot -e "SELECT 1"; then
            break
          fi
          sleep 2
        done

    - name: Create Facture Table
      run: |
        echo "CREATE TABLE IF NOT EXISTS factures (
          id INT AUTO_INCREMENT PRIMARY KEY,
          user_id INT NOT NULL,
          total DECIMAL(10,2) NOT NULL,
          FOREIGN KEY (user_id) REFERENCES users(id)
        );" > schema_facture.sql
        mysql -h 127.0.0.1 -P 3306 -u root -proot devops_java < schema_facture.sql

    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Run only FactureDAOTest
      run: mvn -B test -Dtest=FactureDAOTest
      env:
        DB_URL: jdbc:mysql://localhost:3306/devops_java
        DB_USER: root
        DB_PASSWORD: root



