name: Java CI with Maven

on:
  push:
    branches:
      - lignefacture
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 1234
          MYSQL_DATABASE: devops_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Install dependencies
        run: mvn install -DskipTests

      - name: Wait for MySQL to be ready
        run: |
          echo "Waiting for MySQL to be ready..."
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -u root -p1234 --silent; then
              echo "MySQL is ready!"
              break
            fi
            echo "MySQL not ready yet, waiting..."
            sleep 2
          done

      - name: Create necessary tables
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -p1234 devops_db -e "
          CREATE TABLE IF NOT EXISTS article (
          id INT AUTO_INCREMENT PRIMARY KEY,
          ref VARCHAR(50) NOT NULL,
          nom VARCHAR(255) NOT NULL,
          prixUnitaire DECIMAL(10,2) NOT NULL,
          qte INT NOT NULL
          );
          CREATE TABLE IF NOT EXISTS factures (
          id INT AUTO_INCREMENT PRIMARY KEY,
          user_id INT NOT NULL,
          total DECIMAL(10,2) NOT NULL
          );
          CREATE TABLE IF NOT EXISTS lignefacture (
          id INT PRIMARY KEY AUTO_INCREMENT,
          id_facture INT NOT NULL,
          id_article INT NOT NULL, 
          quantity INT NOT NULL,
          sub_total DECIMAL(10,2) NOT NULL, 
          FOREIGN KEY (id_facture) REFERENCES factures(id),
          FOREIGN KEY (id_article) REFERENCES article(id)
          );
          "

      - name: Configure database connection
        run: |
          echo "Setting up database connection"
          echo "DB_URL=jdbc:mysql://127.0.0.1:3306/devops_db" >> .env
          echo "DB_USER=root" >> .env
          echo "DB_PASSWORD=1234" >> .env

      - name: Run JUnit tests
        run: mvn test
