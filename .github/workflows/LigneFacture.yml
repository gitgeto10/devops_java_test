name: Java CI LigneFacture

on:
  push:
    branches:
      - lignefacture
  pull_request:
    branches:
      - main

jobs:
  build_and_test_facture:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: devops_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Verify schema.sql exists
        run: |
          if [ ! -f schema.sql ]; then
            echo "Error: schema.sql not found"
            exit 1
          fi
          echo "schema.sql content:"
          cat schema.sql

      - name: Wait for MySQL to be ready
        run: |
          for i in {1..30}; do
            if mysql -h 127.0.0.1 -u root -proot -e "SELECT 1" > /dev/null 2>&1; then
              echo " MySQL is up!"
              break
            fi
            echo "Waiting for MySQL..."
            sleep 2
          done

      
      - name: Initialize database for lignefacture
        run: |
            mysql -h 127.0.0.1 -u root -proot devops_db < schema.sql

            mysql -h 127.0.0.1 -u root -proot devops_db -e "SHOW TABLES;" | grep article || { echo "Error: article table not found"; exit 1; }
            mysql -h 127.0.0.1 -u root -proot devops_db -e "SHOW TABLES;" | grep users || { echo "Error: users table not found"; exit 1; }
            mysql -h 127.0.0.1 -u root -proot devops_db -e "SHOW TABLES;" | grep factures || { echo "Error: factures table not found"; exit 1; }
            mysql -h 127.0.0.1 -u root -proot devops_db -e "SHOW TABLES;" | grep lignefacture || { echo "Error: lignefacture table not found"; exit 1; }


      - name: Build and test only lignefacture classes
        run: mvn --batch-mode clean test -Dtest=LigneFactureDAOTest
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/devops_db?useSSL=false&serverTimezone=UTC
          DB_USER: root
          DB_PASSWORD: root
