name: Java CI with Maven and MySQL

on:
  push:
    branches: [ "panier" ]  # Changer "main" en "panier"
  pull_request:
    branches: [ "panier" ]  # Changer "main" en "panier"

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 123456789yassmine
          MYSQL_DATABASE: devops_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -p123456789yassmine"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install MySQL client
      run: sudo apt-get install -y mysql-client

    - name: Wait for MySQL to be ready
      run: |
        for i in {1..60}; do  # Augmenter à 60 secondes
          if mysqladmin ping -h 127.0.0.1 -p123456789yassmine --silent; then
            echo "MySQL is ready!"
            break
          fi
          echo "Waiting for MySQL..."
          sleep 5
        done

    - name: Create tables from schema
      run: |
        mysql -h 127.0.0.1 -P 3306 -u root -p123456789yassmine devops_db < schema_panier.sql

    - name: Check if tables are created
      run: |
        mysql -h 127.0.0.1 -P 3306 -u root -p123456789yassmine -e "SHOW TABLES IN devops_db;"

    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Run PanierDAOTest
      run: mvn -X -Dtest=PanierDAOTest test
