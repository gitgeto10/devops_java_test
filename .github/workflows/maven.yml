name: Java CI with Maven and MySQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
          MYSQL_DATABASE: ${MYSQL_DATABASE}
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping --silent" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Load environment variables from .env
      run: |
        export $(cat .env | xargs)
        echo "Loaded environment variables from .env"

    - name: Wait for MySQL to be ready
      run: |
        if [ -z "$DB_PASS" ]; then
          # Si DB_PASS est vide, on exécute la commande sans mot de passe
          mysql -h 127.0.0.1 -P 3306 -u $DB_USER -e "SELECT 1"
        else
          # Si DB_PASS est défini, on l'inclut dans la commande
          mysql -h 127.0.0.1 -P 3306 -u $DB_USER -p$DB_PASS -e "SELECT 1"
        fi

    - name: Create schema
      run: |
        if [ -z "$DB_PASS" ]; then
          # Si DB_PASS est vide, on exécute la commande sans mot de passe
          mysql -h 127.0.0.1 -P 3306 -u $DB_USER $MYSQL_DATABASE < schema.sql
        else
          # Si DB_PASS est défini, on l'inclut dans la commande
          mysql -h 127.0.0.1 -P 3306 -u $DB_USER -p$DB_PASS $MYSQL_DATABASE < schema.sql
        fi

    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Run tests
      run: mvn test
      env:
        DB_URL: $DB_URL
        DB_USER: $DB_USER
        DB_PASS: $DB_PASS
